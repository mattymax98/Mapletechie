name: Apply approved Pass 1 tag normalization

on:
  push:
    branches:
      - main
    paths:
      - "scripts/migrations/0009_normalize_safe_tag_aliases.sql"

permissions:
  contents: read

jobs:
  apply:
    name: Apply reviewed tag normalization
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RAILWAY_DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify pinned Railway production database
        run: pnpm --filter @workspace/scripts run migrate:railway --check

      - name: Apply exact reviewed Pass 1 migration
        run: pnpm --filter @workspace/scripts run migrate:railway --apply "0009_normalize_safe_tag_aliases.sql" --confirm-railway-production
