kind = "web"
previewPath = "/"
title = "Tech Blog"
version = "1.0.0"
id = "artifacts/tech-blog"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 26015

[services.development]
run = "pnpm --filter @workspace/tech-blog run dev"

[services.production]

[services.production.build]
args = ["pnpm", "--filter", "@workspace/tech-blog", "run", "build"]

[services.production.build.env]
NODE_ENV = "production"
PORT = "26015"
BASE_PATH = "/"

[services.production.run]
args = ["node", "--enable-source-maps", "artifacts/tech-blog/dist/server.mjs"]

[services.production.run.env]
PORT = "26015"
BASE_PATH = "/"
NODE_ENV = "production"
SITE_URL = "https://mapletechie.com"
API_BASE = "https://mapletechie.com"

[services.env]
PORT = "26015"
BASE_PATH = "/"
